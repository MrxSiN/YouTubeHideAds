# Deliberately opt-in. Never publishes third-party XAX binaries or APKs.
# GitHub checkout of public research tool is for ephemeral local compilation;
# this does not grant redistribution rights to its source or emitted artifacts.
name: XAX managed byte-array transport research (not release)
on:
  workflow_dispatch:
jobs:
  transport-structural-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out YouTubeHideAds
        uses: actions/checkout@v4
        with:
          path: YouTubeHideAds
      - name: Check out exact external XAX revision
        uses: actions/checkout@v4
        with:
          repository: MrxSiN/XAX
          ref: 9e44eedfc241d25bb5062b38af105f75234000e2
          path: external/XAX
          persist-credentials: false
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile separate XAX lifecycle APK and managed transport
        working-directory: YouTubeHideAds
        env:
          XAX_SOURCE_DIR: ${{ github.workspace }}/external/XAX
        run: |
          set -euo pipefail
          ./scripts/build_xax_smoke.sh
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/xax-lifecycle-smoke/lifecycle-smoke-evidence.json')
          e=json.loads(p.read_text())
          assert e['apk_verifier']['mode'] == 'smoke'
          assert not e['managed_transport_included']
          t=json.loads(pathlib.Path('build/xax-transport/evidence.json').read_text())
          assert t['method'] == 'roundTrip([B)[B'
          assert not t['android_executed']
          assert not t['brainfuck_invoked']
          assert not e['youtube_hooks']
          print('XAX structural transport build succeeded; device/runtime remain untested')
          PY
      - name: Verify Brainfuck router JNI graphs as a canonical XAX store (structural only)
        working-directory: YouTubeHideAds
        env:
          XAX_SOURCE_DIR: ${{ github.workspace }}/external/XAX
        run: |
          set -euo pipefail
          python3 -m toolchain.xax.check_router_graph \
            --xax-source "$XAX_SOURCE_DIR" \
            --out build/xax-router-graphs/evidence.json \
            --store build/xax-router-graphs/router-graphs.xax-store
          python3 - <<'PYVERIFY'
          import json, pathlib
          result = json.loads(pathlib.Path('build/xax-router-graphs/evidence.json').read_text())
          assert result['status'] == 'XAX_CANONICAL_GRAPH_STORE_VERIFIED_ONLY'
          assert result['guard_exception_dependent_branch_present']
          assert result['exception_clear_derived_from_router_call']
          assert len(result['composed_direct_call_targets']) == 2
          assert not result['composed_other_proofs_bound_to_runtime']
          assert not result['guard_proof_inputs_bound_to_runtime']
          assert not result['apk_built']
          assert not result['android_executed']
          assert not result['brainfuck_invoked_on_android']
          print('XAX canonical graph store verified; no XAX->BF Android dispatch yet')
          PYVERIFY
      - name: Do not redistribute artifacts without explicit upstream rights
        run: |
          echo 'No XAX canonical stores, generated APKs, or third-party code are uploaded.'
          echo 'This workflow is a bounded structural oracle, not Android execution.'
