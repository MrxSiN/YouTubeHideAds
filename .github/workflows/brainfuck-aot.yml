name: Brainfuck AOT, host ABI and XAX artifact gate conformance
on:
  push:
  pull_request:
jobs:
  bf-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict BF, JVM and offline XAX/APK structural tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Build deterministic JVM JARs
        run: |
          PYTHONPATH=. python -m toolchain.brainfuck.build --out generated
          PYTHONPATH=. python -m toolchain.brainfuck.build --out generated-optimized --optimize
          PYTHONPATH=. python -m toolchain.brainfuck.router --out generated
          PYTHONPATH=. python -m toolchain.brainfuck.router --out generated-optimized --optimize
      - name: Verify compiled classes match the authoritative BF programs
        run: PYTHONPATH=. python -m scripts.verify_linkage
      - name: Report Android/XAX blockers without claiming Android tests
        run: PYTHONPATH=. python -m scripts.probe_android_integration
      - name: Language-boundary audit
        run: PYTHONPATH=. python -m toolchain.brainfuck.audit
      - uses: actions/upload-artifact@v4
        with:
          name: brainfuck-jvm-policies-not-android-apk
          path: |
            generated/brainfuck-policies.jar
            generated/policies.json
            generated/brainfuck-router.jar
            generated/router.json
            generated/router.bf
            generated-optimized/brainfuck-router.jar
            generated-optimized/brainfuck-policies.jar
            testdata/bf_abi_v1_vectors.json
